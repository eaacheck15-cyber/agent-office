                            <p class="text-muted ColorLogo">Access your account</p>

                        <form class="card-body pt-3" id="login" name="login" data-ajax-begin="onBegin" data-ajax-failure="onFailed" data-ajax-success="onSuccess" method="post" data-ajax="true" action="/">
                            <div class="form-group">
                                <label class="form-label ColorLogo">Email</label>
                                <div class="input-group mb-4">
                                    <div class="input-group">

                                        </span>
                                        <input class="form-control" placeholder="Email" required="required" type="email" name="Email">
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label ColorLogo">Password</label>
                                <div class="input-group mb-4">
                                    <span class="input-group-text bgColorLogo" style="border:solid 1px #8b0000;color:white;">
                                        <i class="fe fe-lock" aria-hidden="true"></i>
                                    </span>
                                    <input class="form-control" type="password" id="password" placeholder="Password" required="required" name="Password">
                                    <span class="input-group-append">
                                        <a class="btn btn-primary" id="show_password" onclick="ShowPassword();">
                                            <i class="fa fa-eye-slash" data-toggle="tooltip" title="" data-original-title="fa fa-eye-slash"></i>
                                        </a>
                                    </span>
                                </div>
                            </div>
                            <div class="form-group">

                                    <input type="checkbox" class="custom-control-input" name="example-checkbox1" value="option1">

                                </label>
                            </div>
                            <div class="submit">
                                <button type="submit" id="login-submit" class="btn btn-primary btn-block"><span>Login</span></button>
                            </div>
                            <div class="text-center mt-3">
                                <p class="mb-2"><a class="text-primary ms-1 ColorLogo" href="/account/forgotpassword">Forgot Password</a></p>
                                <p class="text-dark mb-0 ColorLogo">Don't have account ? <a class="text-primary ms-1 ColorLogo" href="/account/register">Register</a></p>
                            </div>

</div>

<script type="text/javascript">


    var onSuccess = function (response) {
        $("#login-submit").removeClass("btn-loading");
        if (response.response.responseCode == 0) {

            window.location.href = '/dashboard/index'
        }
        else {
            Swal.fire({
                title: 'Oops...',
                text: response.response.responseMessage,
                icon: "error",
                buttonsStyling: !1,
                confirmButtonText: "Ok",
                customClass: {
                    confirmButton: "btn btn-primary"
                }
            });
        }

    };

    var onFailed = function (response) {
        $("#login-submit").removeClass("btn-loading");
        Swal.fire({
            title: 'Oops...',
            text: response.response.responseMessage,
            icon: "error",
            buttonsStyling: !1,
            confirmButtonText: "Ok",
            customClass: {
                confirmButton: "btn btn-primary"
            }
        });
    };

    var onBegin = function (response) {
        $("#login-submit").addClass("btn-loading");
    };

    function ShowPassword() {
        var type = $("#password").attr("type");
        if (type == 'password') {
            $("#password").attr("type", "text");
            $("#show_password i").removeClass("fa-eye-slash");
            $("#show_password i").addClass("fa-eye");
        } else {
            $("#show_password i").addClass("fa-eye-slash");
            $("#show_password i").removeClass("fa-eye");
            $("#password").attr("type", "password");
        }
    }

</script>
